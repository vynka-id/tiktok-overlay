<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at top right, #1e112a, #0b0c10 70%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 60px;
    overflow: hidden;
    position: relative;
  }

  .glow-cyan {
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(0, 242, 254, 0.15);
    filter: blur(140px);
    top: 10%;
    left: -100px;
    border-radius: 50%;
  }

  .glow-pink {
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(254, 44, 85, 0.18);
    filter: blur(140px);
    bottom: 10%;
    right: -100px;
    border-radius: 50%;
  }

  .badge {
    background: rgba(254, 44, 85, 0.2);
    border: 2px solid #fe2c55;
    color: #ff6b88;
    padding: 10px 28px;
    border-radius: 50px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 25px;
  }

  h1 {
    font-size: 80px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #00f2fe, #ffffff, #fe2c55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    font-size: 30px;
    color: #cbd5e1;
    line-height: 1.4;
    max-width: 800px;
    margin-bottom: 40px;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    border-radius: 25px;
    padding: 30px 40px;
    width: 100%;
    max-width: 760px;
    margin-bottom: 35px;
  }

  .card-title {
    font-size: 20px;
    color: #00f2fe;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .card-schedule {
    font-size: 38px;
    font-weight: 800;
    color: #ffffff;
  }

  .socials {
    display: flex;
    gap: 20px;
    font-size: 24px;
    color: #94a3b8;
    font-weight: 600;
  }

  .socials span {
    background: rgba(255, 255, 255, 0.08);
    padding: 12px 24px;
    border-radius: 14px;
    color: #f8fafc;
  }
</style>
</head>
<body>
  <div class="glow-cyan"></div>
  <div class="glow-pink"></div>

  <div class="badge">● STREAM SELESAI</div>
  <h1>TERIMA KASIH<br>SUDAH NONTON!</h1>
  <p class="subtitle">Makasih banyak buat semua yang sudah mampir, tap-tap layar, dan dukung live hari ini.</p>

  <div class="card">
    <div class="card-title">Jadwal Live Berikutnya</div>
    <div class="card-schedule">Setiap Hari • 20.00 WIB</div>
  </div>

  <div class="socials">
    <span>TikTok: @vynka</span>
    <span>IG: @vynka</span>
  </div>
</body>
</html>
