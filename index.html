<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  /* Mengisi seluruh layar browser/studio secara penuh */
  body {
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at top right, #1e112a, #0b0c10 70%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
    overflow: hidden;
    position: relative;
  }

  .glow-cyan {
    position: absolute;
    width: 35vw;
    height: 35vw;
    background: rgba(0, 242, 254, 0.15);
    filter: blur(120px);
    top: 15%;
    left: -10vw;
    border-radius: 50%;
  }

  .glow-pink {
    position: absolute;
    width: 35vw;
    height: 35vw;
    background: rgba(254, 44, 85, 0.18);
    filter: blur(120px);
    bottom: 15%;
    right: -10vw;
    border-radius: 50%;
  }

  /* Badge status bergerak */
  .badge {
    background: rgba(254, 44, 85, 0.2);
    border: 2px solid #fe2c55;
    color: #ff6b88;
    padding: 10px 30px;
    border-radius: 50px;
    font-size: 2.2vh;
    font-weight: 600;
    letter-spacing: 3px;
    margin-bottom: 3vh;
    animation: bounceGlow 2s infinite ease-in-out;
  }

  h1 {
    font-size: 7.5vh;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 2.5vh;
    background: linear-gradient(90deg, #00f2fe, #ffffff, #fe2c55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    font-size: 3vh;
    color: #cbd5e1;
    line-height: 1.4;
    max-width: 800px;
    margin-bottom: 4vh;
  }

  .next-live {
    font-size: 3.2vh;
    font-weight: 600;
    color: #00f2fe;
    letter-spacing: 2px;
    background: rgba(0, 242, 254, 0.08);
    border: 1px solid rgba(0, 242, 254, 0.2);
    padding: 2vh 4vw;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    animation: fadeInOut 3s infinite alternate;
  }

  @keyframes bounceGlow {
    0%, 100% { 
      transform: scale(1); 
      box-shadow: 0 0 10px rgba(254,44,85,0.3);
    }
    50% { 
      transform: scale(1.06); 
      box-shadow: 0 0 25px rgba(254,44,85,0.6);
    }
  }

  @keyframes fadeInOut {
    0% { opacity: 0.8; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>

  <div class="glow-cyan"></div>
  <div class="glow-pink"></div>

  <div class="badge">● STREAM SELESAI</div>
  <h1>TERIMA KASIH<br>SUDAH NONTON!</h1>
  <p class="subtitle">Makasih banyak buat semua yang sudah mampir, tap-tap layar, dan dukung live hari ini ya!</p>

  <div class="next-live">✨ Nantikan live berikutnya ✨</div>

</body>
</html>
